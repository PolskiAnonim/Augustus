[versions]
octavius-postgresql = "0.9.9"
octavius-i18n = "1.0.0"
dokka = "2.2.0"
compose-multiplatform = "1.11.0"
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
# api-server
ktor = "3.5.0"
# koin
koin = "4.2.1"
#test/log
junit = "6.0.2"
assertj-core = "4.0.0-M1"
mockk = "1.14.9"
logback = "1.5.32"
kotlin-logging = "7.0.14"
shadow = "9.4.1"
hikari = "7.1.0"
[libraries]
# octavius-postgresql
octavius-annotations = { group = "io.github.octavius-framework", name = "annotations", version.ref = "octavius-postgresql" }
octavius-driver = { group = "io.github.octavius-framework", name = "driver", version.ref = "octavius-postgresql" }
octavius-client = { group = "io.github.octavius-framework", name = "client", version.ref = "octavius-postgresql" }
octavius-client-scanner = { group = "io.github.octavius-framework", name = "client-scanner", version.ref = "octavius-postgresql" }
octavius-migrations = { group = "io.github.octavius-framework", name = "migrations", version.ref = "octavius-postgresql" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
octavius-i18n-core = { group = "io.github.octavius-framework", name = "i18n-core", version.ref = "octavius-i18n" }
# kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
#api server
ktor-server-core = {  group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor"}
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }
#api client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-js = { group = "io.ktor", name = "ktor-client-js", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
# Koin
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-slf4j = { group = "io.insert-koin", name = "koin-logger-slf4j" }
# test / log
# JUnit 5 - tylko co potrzebne
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj-core" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlin-logging" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
octaviusI18n = { id = "io.github.octavius-framework.i18n",  version.ref = "octavius-i18n" }